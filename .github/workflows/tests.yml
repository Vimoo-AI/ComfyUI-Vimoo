name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    env:
      COMFYUI_REVISION: 3216c62e9962c3babd28a4dfea6e5aef50b8fe16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip==26.2.1
      - name: Check out ComfyUI
        run: |
          git clone https://github.com/Comfy-Org/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
          git -C "$RUNNER_TEMP/ComfyUI" checkout "$COMFYUI_REVISION"
      - run: >-
          python -m pip install torch==2.9.0+cpu torchvision==0.24.0+cpu torchaudio==2.9.0+cpu
          --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pip install -r "$RUNNER_TEMP/ComfyUI/requirements.txt" -r requirements.txt
      - run: python -m pip install ruff==0.9.10
      - run: ruff check .
      - run: ruff format --check .
      - run: PYTHONPATH="$RUNNER_TEMP/ComfyUI" python -m unittest discover -s tests -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.mjs
